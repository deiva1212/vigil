title: New listening port opened
id: vigil-0150
name: new_listening_port
description: A process started listening on a new port; unexpected listeners can be backdoors or bind shells.
level: low
tags:
  - attack.persistence
  - attack.command-and-control
  - attack.t1571
logsource:
  category: network_connection
detection:
  selection:
    event.action: listen_port_opened
  condition: selection
