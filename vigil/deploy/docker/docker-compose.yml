# docker compose -f deploy/docker/docker-compose.yml up -d
# Admin password: set VIGIL_ADMIN_PASSWORD below, or read it from `docker logs vigil-server`.
services:
  vigil-server:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
    container_name: vigil-server
    restart: unless-stopped
    ports:
      - "8443:8443"
      - "5514:5514/udp"
      - "5514:5514/tcp"
    environment:
      VIGIL_ADMIN_PASSWORD: "change-me-to-a-long-password"
      VIGIL_NOTIFY_LEVEL: high
      # VIGIL_WEBHOOK_URL: https://hooks.slack.com/services/...
    volumes:
      - vigil-data:/var/lib/vigil
volumes:
  vigil-data:
