policy: vigil-windows-baseline
checks:
  - id: win-001
    title: Windows Firewall is enabled for all profiles
    rationale: Host firewall limits exposure of local services.
    remediation: Set-NetFirewallProfile -Profile Domain,Public,Private -Enabled True
    compliance: [CIS 9.1.1, PCI-DSS 1.3.1]
    command: powershell -NoProfile -Command "(Get-NetFirewallProfile | Where-Object {$_.Enabled -eq $false}).Name"
    expect_empty: true
  - id: win-002
    title: SMBv1 is disabled
    rationale: SMBv1 is exploited by worms such as WannaCry (MS17-010).
    remediation: Disable-WindowsOptionalFeature -Online -FeatureName SMB1Protocol
    compliance: [CIS 18.3.3]
    command: powershell -NoProfile -Command "(Get-SmbServerConfiguration).EnableSMB1Protocol"
    contains: '(?i)false'
  - id: win-003
    title: Guest account is disabled
    rationale: The guest account allows unauthenticated local access.
    remediation: net user guest /active:no
    compliance: [CIS 2.3.1.2]
    command: net user guest
    contains: '(?i)Account active\s+No'
